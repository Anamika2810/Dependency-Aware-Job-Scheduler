server:
  port: 8080

spring:
  application:
    name: job-scheduler

  datasource:
    url: jdbc:mysql://localhost:3306/job_scheduler_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is fine for dev; switch to 'validate' once the schema stabilizes
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.hibernate.SQL: debug
    com.yourorg.jobscheduler: debug
